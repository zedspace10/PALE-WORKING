<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #05070c;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      { "imports": { "three": "./three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";
      import {
        q,
        W,
        H,
        makeRenderer,
        load,
        stars,
        atmosphere,
        rng,
      } from "./common.mjs";
      const renderer = makeRenderer();
      renderer.setClearColor(0x05070c, 1);
      const s = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 2000);

      // Earth with clouds and its thin blue air, lit from direction L.
      async function earthGlobe(L, rotY) {
        const [tex, clouds] = await Promise.all([
          load("earth.webp"),
          load("earth-clouds.webp"),
        ]);
        const g = new THREE.Group();
        const e = new THREE.Mesh(
          new THREE.SphereGeometry(1, 192, 192),
          new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }),
        );
        e.rotation.set(0.3, rotY, 0.41);
        g.add(e);
        const c = new THREE.Mesh(
          new THREE.SphereGeometry(1.006, 192, 192),
          new THREE.MeshStandardMaterial({
            color: 0xffffff,
            alphaMap: clouds,
            transparent: true,
            depthWrite: false,
            roughness: 1,
          }),
        );
        c.rotation.copy(e.rotation);
        c.rotation.y += 0.5;
        g.add(c);
        g.add(atmosphere(1, 0.05, 0x5aa6ff, 1.6, L));
        return g;
      }

      // Craters: a height map built from thousands of bowls with raised rims, big ones rare.
      function craterField(N, seed) {
        const r = rng(seed);
        const h = new Float32Array(N * N);
        const add = (cx, cy, R, depth) => {
          const x0 = Math.max(0, Math.floor(cx - R * 1.6)),
            x1 = Math.min(N - 1, Math.ceil(cx + R * 1.6));
          const y0 = Math.max(0, Math.floor(cy - R * 1.6)),
            y1 = Math.min(N - 1, Math.ceil(cy + R * 1.6));
          for (let y = y0; y <= y1; y++)
            for (let x = x0; x <= x1; x++) {
              const d = Math.hypot(x - cx, y - cy) / R;
              let v = 0;
              if (d < 1)
                v = -depth * (1 - d * d) + depth * 0.25 * Math.pow(d, 6);
              else if (d < 1.6)
                v = depth * 0.25 * Math.exp(-(((d - 1) / 0.22) ** 2));
              h[y * N + x] += v;
            }
        };
        for (let i = 0; i < 9000; i++) {
          const R = 1.5 + Math.pow(r(), 7) * 140;
          add(r() * N, r() * N, R, R * 0.18);
        }
        // fine rubble
        for (let i = 0; i < h.length; i++) h[i] += (r() - 0.5) * 0.6;
        let mn = Infinity,
          mx = -Infinity;
        for (const v of h) {
          if (v < mn) mn = v;
          if (v > mx) mx = v;
        }
        const cv = document.createElement("canvas");
        cv.width = cv.height = N;
        const cx = cv.getContext("2d");
        const img = cx.createImageData(N, N);
        for (let i = 0; i < h.length; i++) {
          const v = Math.round((255 * (h[i] - mn)) / (mx - mn));
          img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
          img.data[i * 4 + 3] = 255;
        }
        cx.putImageData(img, 0, 0);
        const t = new THREE.CanvasTexture(cv);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
      }

      async function earthrise() {
        // Sunlight from the left, low over the ground, so every crater shows its shape.
        const L = new THREE.Vector3(-1, 0.32, 0.25).normalize();
        const sun = new THREE.DirectionalLight(0xfff8ee, 3.0);
        sun.position.copy(L.clone().multiplyScalar(10));
        s.add(sun);
        s.add(new THREE.AmbientLight(0x10141a, 0.03));
        // The ground: a wide sheet pushed up and down by craters, curving away like a small world.
        const SIZE = 420,
          SEG = 1100,
          Rcurve = 220;
        const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
        geo.rotateX(-Math.PI / 2);
        const r = rng(11);
        const N = SEG + 1;
        const h = new Float32Array(N * N);
        const add = (cx, cy, R, depth) => {
          const x0 = Math.max(0, Math.floor(cx - R * 1.7)),
            x1 = Math.min(N - 1, Math.ceil(cx + R * 1.7));
          const y0 = Math.max(0, Math.floor(cy - R * 1.7)),
            y1 = Math.min(N - 1, Math.ceil(cy + R * 1.7));
          for (let y = y0; y <= y1; y++)
            for (let x = x0; x <= x1; x++) {
              const d = Math.hypot(x - cx, y - cy) / R;
              let v = 0;
              if (d < 1)
                v = -depth * (1 - d * d) + depth * 0.3 * Math.pow(d, 8);
              else if (d < 1.7)
                v = depth * 0.3 * Math.exp(-(((d - 1) / 0.25) ** 2));
              h[y * N + x] += v;
            }
        };
        for (let i = 0; i < 2600; i++) {
          const R = 2 + Math.pow(r(), 5) * 45;
          add(r() * N, r() * N, R, R * (R > 15 ? 0.1 : 0.16));
        }
        for (let i = 0; i < 26000; i++) {
          const R = 0.9 + r() * 2.2;
          add(r() * N, r() * N, R, R * 0.18);
        }
        for (let i = 0; i < h.length; i++) h[i] += (r() - 0.5) * 0.25;
        const pos = geo.attributes.position;
        const col = new Float32Array(pos.count * 3);
        const albedo = (x, z) =>
          0.62 +
          0.12 * Math.sin(x * 0.03 + 1.3) * Math.cos(z * 0.025) +
          0.05 * Math.sin(x * 0.11 + z * 0.07);
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i),
            z = pos.getZ(i);
          const gx = Math.round((x / SIZE + 0.5) * SEG),
            gz = Math.round((z / SIZE + 0.5) * SEG);
          const hh = h[gz * N + gx] * (SIZE / SEG);
          const drop = (x * x + z * z) / (2 * Rcurve);
          pos.setY(i, hh - drop + (r() - 0.5) * 0.02);
          const a = albedo(x, z);
          col[i * 3] = a;
          col[i * 3 + 1] = a * 0.97;
          col[i * 3 + 2] = a * 0.92;
        }
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        geo.computeVertexNormals();
        const ground = new THREE.Mesh(
          geo,
          new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 1,
            color: 0x8f8a82,
          }),
        );
        s.add(ground);
        const earth = await earthGlobe(L, -1.4);
        earth.position.set(10, 8, -200);
        earth.scale.setScalar(7);
        s.add(earth);
        s.add(stars(500, 600, 5, 1.2));
        cam.fov = 24;
        cam.updateProjectionMatrix();
        cam.position.set(0, 9, 150);
        cam.lookAt(4, 9, -200);
      }

      // Saturn's rings from their real radii, as on the Saturn picture.
      function ringStrip() {
        const N = 2048,
          data = new Uint8Array(N * 4),
          r = rng(42);
        const inner = 1.236,
          outer = 2.269;
        let wob = 0;
        const fine = [];
        for (let i = 0; i < N; i++) {
          wob = wob * 0.86 + (r() - 0.5) * 0.5;
          fine.push(wob);
        }
        for (let i = 0; i < N; i++) {
          const rr = inner + (i / (N - 1)) * (outer - inner);
          let a = 0;
          if (rr < 1.528) a = 0.08 + (0.1 * (rr - 1.236)) / 0.29;
          else if (rr < 1.951)
            a =
              0.85 +
              0.12 * Math.sin(Math.min((rr - 1.528) / 0.423, 1) * Math.PI);
          else if (rr < 2.027) a = 0.05;
          else {
            a = 0.5 - (0.12 * (rr - 2.027)) / 0.242;
            if (Math.abs(rr - 2.2165) < 0.0035) a = 0.04;
            if (rr > 2.255) a *= (2.269 - rr) / 0.014;
          }
          a = Math.max(0, Math.min(1, a * (1 + fine[i] * 0.25)));
          data.set([200, 190, 175, a * 255], i * 4);
        }
        const t = new THREE.DataTexture(data, N, 1);
        t.needsUpdate = true;
        t.magFilter = t.minFilter = THREE.LinearFilter;
        return { t, inner, outer };
      }

      async function saturnback() {
        const tex = await load("saturn.webp");
        // The Sun is behind Saturn: we sit in its shadow and look back towards the light.
        const L = new THREE.Vector3(0.05, 0.08, -1).normalize();
        const g = new THREE.Group();
        g.rotation.set(0.22, 0, -0.32);
        s.add(g);
        const planet = new THREE.Mesh(
          new THREE.SphereGeometry(1, 192, 192),
          new THREE.MeshStandardMaterial({
            map: tex,
            roughness: 1,
            color: 0x2a2620,
          }),
        );
        planet.scale.set(1, 0.902, 1);
        g.add(planet);
        const fill = new THREE.DirectionalLight(0xffe2b0, 0.5);
        fill.position.set(0, -1, 0.3);
        s.add(fill); // light bounced off the rings onto the night side
        // A glowing edge where sunlight passes through the top of the atmosphere.
        const limb = new THREE.Mesh(
          new THREE.SphereGeometry(1.012, 192, 192),
          new THREE.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            uniforms: { L: { value: L } },
            vertexShader: `varying vec3 n; varying vec3 v; varying vec3 wn; void main(){ wn = normalize(mat3(modelMatrix)*normal); n = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); v = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
            fragmentShader: `uniform vec3 L; varying vec3 n; varying vec3 v; varying vec3 wn; void main(){ float d = -dot(n, v); float a = pow(clamp(d / 0.22, 0., 1.), 1.3) * 1.6; float side = 0.45 + 0.55 * smoothstep(-0.3, 0.6, dot(wn, -L) * -1. + 0.5); gl_FragColor = vec4(vec3(1.0, 0.86, 0.62) * a * 1.4 * side, 1.); }`,
          }),
        );
        limb.scale.set(1, 0.902, 1);
        g.add(limb);
        const { t, inner, outer } = ringStrip();
        const rg = new THREE.RingGeometry(inner, outer, 512, 8);
        const pos = rg.attributes.position,
          uv = rg.attributes.uv,
          v3 = new THREE.Vector3();
        for (let i = 0; i < pos.count; i++) {
          v3.fromBufferAttribute(pos, i);
          uv.setXY(i, (v3.length() - inner) / (outer - inner), 0.5);
        }
        // Backlit rings: thin parts glow as sunlight scatters forwards through them; the thick B ring stays dark.
        const ringMat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: {
            map: { value: t },
            L: { value: L },
            inv: { value: new THREE.Matrix4() },
          },
          vertexShader: `varying vec2 vUv; varying vec3 wp; void main(){ vUv = uv; vec4 w = modelMatrix*vec4(position,1.); wp = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
          fragmentShader: `uniform sampler2D map; uniform vec3 L; uniform mat4 inv; varying vec2 vUv; varying vec3 wp;
      void main(){ float a = texture2D(map, vUv).a;
        vec3 o = (inv*vec4(wp,1.)).xyz; vec3 d = normalize((inv*vec4(L,0.)).xyz); o.y /= 0.902; d.y /= 0.902;
        float b = dot(o,d), cc = dot(o,o)-1., a2 = dot(d,d); float disc = b*b - a2*cc; float sh = (disc > 0. && -b > 0.) ? 0.0 : 1.0;
        float glow = a * (1.0 - a) * (1.0 - a) * 6.75; vec3 col = vec3(1.0, 0.9, 0.76) * glow * 1.1 * sh;
        gl_FragColor = vec4(col, max(a * 0.85, glow * 0.6)); }`,
        });
        const ring = new THREE.Mesh(rg, ringMat);
        ring.rotation.x = -Math.PI / 2;
        g.add(ring);
        g.updateMatrixWorld(true);
        ringMat.uniforms.inv.value.copy(g.matrixWorld).invert();
        // The Sun's glare, hidden just behind the planet.
        const glare = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: (() => {
              const c = document.createElement("canvas");
              c.width = c.height = 512;
              const x = c.getContext("2d");
              const gr = x.createRadialGradient(256, 256, 0, 256, 256, 256);
              gr.addColorStop(0, "rgba(255,240,215,1)");
              gr.addColorStop(0.08, "rgba(255,225,180,0.55)");
              gr.addColorStop(0.35, "rgba(255,200,150,0.08)");
              gr.addColorStop(1, "rgba(0,0,0,0)");
              x.fillStyle = gr;
              x.fillRect(0, 0, 512, 512);
              const tt = new THREE.CanvasTexture(c);
              tt.colorSpace = THREE.SRGBColorSpace;
              return tt;
            })(),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          }),
        );
        glare.position.copy(L.clone().multiplyScalar(30));
        glare.scale.set(20, 20, 1);
        s.add(glare);
        s.add(stars(900, 300, 13, 1.2));
        cam.position.set(0, 0, 11.5);
        cam.lookAt(0, 0, 0);
      }

      const scenes = { earthrise, saturnback };
      await scenes[q.get("scene")]();
      renderer.render(s, cam);
      window.done = true;
    </script>
  </body>
</html>
